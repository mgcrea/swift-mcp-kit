name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Both ends, and a failure on one still runs the other: knowing whether a break is
      # "only on the floor" or "only on the newest" is most of the diagnosis.
      fail-fast: false
      matrix:
        # macos-15 is the package's declared floor, and that is the point: building only on
        # the newest runner would let a macOS 26 symbol through and break the consumers that
        # target lower. macos-latest catches the opposite failure — source that no longer
        # compiles on the toolchain the consuming apps are actually built with.
        # The round-trip suite binds real loopback ports, so each also checks that the socket
        # setup works on that OS.
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  # A gate rather than a suggestion: --strict turns every lint finding into a failure.
  # One runner only, and the newest one, because --strict on two swift-format versions fails
  # whenever they disagree about a file neither author nor reviewer touched.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: xcrun swift-format lint --strict --recursive Package.swift Sources Tests

  # Mac Catalyst is a platform of its own to the compiler: `canImport(AppKit)` is true there
  # while every AppKit symbol is unavailable, so a fence that builds on the Mac and on iOS can
  # still break it. `swift build` cannot target it; xcodebuild can.
  catalyst:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build for Mac Catalyst
        run: >-
          xcodebuild build -scheme swift-mcp-kit-Package
          -destination 'generic/platform=macOS,variant=Mac Catalyst'
